name: Збірка моду

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Збірка
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Готовий мод (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: pletinnya-mod
          path: build/libs/*[!s].jar
      - name: Опублікувати реліз
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" "$JAR" --title "Плетіння $VERSION" \
            --notes "Мод «Плетіння» для Minecraft 1.21.1 (Fabric). Покладіть .jar у папку mods разом із Fabric API."
