name: Димовий тест

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Пакети для віртуального екрана
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: Тест
        run: |
          chmod +x gradlew ci/smoke.sh
          ./ci/smoke.sh
      - name: Знімки екрана
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls run/screenshots/*.png >/dev/null 2>&1; then
            gh release delete ci-shots --yes --cleanup-tag || true
            gh release create ci-shots run/screenshots/*.png --prerelease --title "CI: знімки" --notes "Автоматичні знімки з гри" --target dev
          fi
